name: Binary ZIP migration and Windows build

on:
  push:
    branches: [csharp-port-zip]

permissions:
  contents: write

jobs:
  migrate-and-build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout ZIP branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project ZIP
        shell: pwsh
        run: |
          if (-not (Test-Path project.zip)) { throw 'project.zip is missing' }
          Remove-Item extracted -Recurse -Force -ErrorAction SilentlyContinue
          7z x project.zip -oextracted -y

      - name: Verify extracted project
        shell: pwsh
        run: |
          $required = @(
            'ExecMcp.slnx',
            'src/ExecMcp.Core/ExecMcp.Core.csproj',
            'src/ExecMcp.Cli/ExecMcp.Cli.csproj',
            'src/ExecMcp.SnippingCallback/ExecMcp.SnippingCallback.csproj',
            'tests/ExecMcp.Tests/ExecMcp.Tests.csproj',
            'src/ExecMcp.Package/Package.appxmanifest',
            'scripts/Build-Msix.ps1',
            'scripts/Install-ExecMcp.ps1',
            'scripts/Uninstall-ExecMcp.ps1'
          )
          foreach ($path in $required) {
            $full = Join-Path 'extracted' $path
            if (-not (Test-Path $full)) { throw "Missing extracted file: $path" }
          }

      - name: Move extracted files into repository root
        shell: pwsh
        run: |
          Get-ChildItem -Force | Where-Object { $_.Name -notin @('.git','project.zip','extracted') } | Remove-Item -Recurse -Force
          Get-ChildItem extracted -Force | ForEach-Object { Move-Item $_.FullName -Destination . -Force }
          Remove-Item extracted -Recurse -Force

      - name: Commit and push extracted project
        id: migrate
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: extract project.zip into repository [skip ci]'
          git push origin HEAD:csharp-port-zip
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Verify final files directly from GitHub
        shell: pwsh
        run: |
          $sha = '${{ steps.migrate.outputs.sha }}'
          $paths = @(
            'ExecMcp.slnx',
            'src/ExecMcp.Core/ExecMcp.Core.csproj',
            'src/ExecMcp.Cli/Program.cs',
            'tests/ExecMcp.Tests/ExecMcp.Tests.csproj',
            'src/ExecMcp.Package/Package.appxmanifest'
          )
          foreach ($path in $paths) {
            $url = "https://raw.githubusercontent.com/Areo-RGB/execli/$sha/$path"
            $response = Invoke-WebRequest -UseBasicParsing -Uri $url
            if ($response.StatusCode -ne 200 -or $response.Content.Length -eq 0) { throw "GitHub verification failed: $path" }
            Write-Host "Verified from GitHub: $path"
          }

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Test legacy JavaScript reference
        shell: pwsh
        run: |
          pnpm --dir legacy-js install --no-frozen-lockfile
          pnpm --dir legacy-js test

      - name: Test C# implementation
        shell: pwsh
        run: dotnet test tests/ExecMcp.Tests/ExecMcp.Tests.csproj -c Release -r win-x64 --logger "trx;LogFileName=execmcp.trx"

      - name: Publish framework-dependent binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts\publish\cli, artifacts\publish\callback | Out-Null
          dotnet publish src/ExecMcp.Cli/ExecMcp.Cli.csproj -c Release -r win-x64 --self-contained false -o artifacts\publish\cli
          dotnet publish src/ExecMcp.SnippingCallback/ExecMcp.SnippingCallback.csproj -c Release -r win-x64 --self-contained false -o artifacts\publish\callback
          Copy-Item artifacts\publish\cli\execmcp.exe artifacts\publish\cli\execmcp-cs.exe

      - name: Verify unpackaged compatibility
        shell: pwsh
        run: .\scripts\Compatibility.ps1 -Exe (Resolve-Path artifacts\publish\cli\execmcp-cs.exe) -Output artifacts\compatibility-unpackaged.json

      - name: Generate signing certificate
        id: cert
        shell: powershell
        run: |
          $cert = .\scripts\New-DevCertificate.ps1 | ConvertFrom-Json
          Import-Certificate -FilePath $cert.Cer -CertStoreLocation 'Cert:\CurrentUser\TrustedPeople' | Out-Null
          Import-Certificate -FilePath $cert.Cer -CertStoreLocation 'Cert:\LocalMachine\Root' | Out-Null
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          "cer=$($cert.Cer)" >> $env:GITHUB_OUTPUT

      - name: Build and sign MSIX
        shell: powershell
        run: |
          .\scripts\Build-Msix.ps1 `
            -CliPublishPath artifacts\publish\cli `
            -CallbackPublishPath artifacts\publish\callback `
            -CertificateThumbprint '${{ steps.cert.outputs.thumbprint }}' `
            -OutputPath artifacts\msix\ExecMcp.msix

      - name: Install and verify MSIX
        shell: powershell
        run: |
          .\scripts\Install-ExecMcp.ps1 -MsixPath artifacts\msix\ExecMcp.msix -CertificatePath '${{ steps.cert.outputs.cer }}'
          .\scripts\Verify-Package.ps1
          .\scripts\Compatibility.ps1 -Exe execmcp.exe -Output artifacts\compatibility-packaged.json

      - name: Uninstall test package
        if: always()
        shell: powershell
        run: .\scripts\Uninstall-ExecMcp.ps1

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csharp-port-zip-build
          path: |
            project.zip
            artifacts/**
            **/TestResults/*.trx
          if-no-files-found: warn
